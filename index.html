<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D VR Scatter Plot</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: sans-serif; }
        #vr-button-container { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 999; display: flex; gap: 15px; }
    </style>
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="vr-button-container"></div>
    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.6, 1); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        renderer.setClearColor(0x000000, 0); 
        document.body.appendChild(renderer.domElement);

        const vrBtn = VRButton.createButton(renderer);
        const arBtn = ARButton.createButton(renderer, { requiredFeatures: ['hit-test'], optionalFeatures: ['local-floor'] });
        vrBtn.style.position = 'static'; arBtn.style.position = 'static';
        document.getElementById('vr-button-container').append(vrBtn, arBtn);

        renderer.xr.addEventListener('sessionstart', () => {
            const session = renderer.xr.getSession();
            if (session.environmentBlendMode === 'additive' || session.environmentBlendMode === 'alpha-blend') {
                scene.background = null; 
            }
        });
        renderer.xr.addEventListener('sessionend', () => { scene.background = new THREE.Color(0x222222); });

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(2, 5, 3);
        scene.add(dirLight);

        // --- DATA GENERATION ---
        const sectors = ["Tech", "Finance", "Health", "Retail", "Energy"];
        const colors = { "Tech": 0x3498db, "Finance": 0x2ecc71, "Health": 0xe74c3c, "Retail": 0xf1c40f, "Energy": 0x9b59b6 };
        let activeSectors = { "Tech": true, "Finance": true, "Health": true, "Retail": true, "Energy": true };
        
        const data = [];
        for (let i = 1; i <= 50; i++) {
            data.push({
                name: "Fictional Corp " + i,
                revenue: Math.random() * 400 + 10,
                marketCap: Math.random() * 2000 + 50,
                employees: Math.floor(Math.random() * 490000 + 10000),
                age: Math.floor(Math.random() * 100 + 5),
                sector: sectors[Math.floor(Math.random() * sectors.length)]
            });
        }
        
        const maxRev = Math.max(...data.map(d => d.revenue));
        const maxCap = Math.max(...data.map(d => d.marketCap));
        const maxEmp = Math.max(...data.map(d => d.employees));

        // --- UI HELPER ---
        function createTextPanel(textLines, bgColor, textColor, w, h, fSize) {
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            const texture = new THREE.CanvasTexture(canvas);
            const mesh = new THREE.Mesh(
                new THREE.PlaneGeometry(w / 1000, h / 1000),
                new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide })
            );
            mesh.userData.updateText = (newLines, overrideBgColor) => {
                ctx.fillStyle = overrideBgColor || bgColor;
                ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = textColor;
                ctx.font = `bold ${fSize}px sans-serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                const lh = fSize * 1.3;
                const startY = (h - (newLines.length - 1) * lh) / 2;
                newLines.forEach((line, i) => ctx.fillText(line, w / 2, startY + i * lh));
                texture.needsUpdate = true;
            };
            mesh.userData.updateText(textLines);
            return mesh;
        }

        // --- BUILD SCENE GRAPH ---
        const containerGroup = new THREE.Group();
        containerGroup.position.set(0, 1.2, -1.8); 
        scene.add(containerGroup);

        const graphGroup = new THREE.Group();
        graphGroup.position.set(-0.5, -0.5, 0.5); 
        containerGroup.add(graphGroup);

        const intersectables = [];
        const pointGroups = [];

        // Axes (meeting at 0,0,0 of graphGroup, which is bottom-left-front)
        const lineMat = new THREE.LineBasicMaterial({ color: 0x888888 });
        const axesGeom = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(1.0, 0, 0), new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0, 1.0, 0), new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0, 0, -1.0)
        ]);
        graphGroup.add(new THREE.Line(axesGeom, lineMat));

        // Labels
        const lblX = createTextPanel(["Revenue →"], "#333", "#FFF", 300, 100, 36);
        lblX.position.set(1.15, 0, 0); graphGroup.add(lblX);
        const lblY = createTextPanel(["Market Cap ↑"], "#333", "#FFF", 300, 100, 36);
        lblY.position.set(0, 1.1, 0); graphGroup.add(lblY);
        const lblZ = createTextPanel(["Employees ↙"], "#333", "#FFF", 300, 100, 36);
        lblZ.position.set(0, 0, -1.15); graphGroup.add(lblZ);

        // Data Points
        const sphereGeom = new THREE.SphereGeometry(1, 16, 16);
        data.forEach(d => {
            const pGroup = new THREE.Group();
            const px = d.revenue / maxRev;
            const py = d.marketCap / maxCap;
            const pz = -(d.employees / maxEmp);
            pGroup.position.set(px, py, pz);
            pGroup.userData = { isDataPoint: true, data: d, sector: d.sector };
            
            const radius = 0.01 + (d.age / 150) * 0.03;
            const visual = new THREE.Mesh(sphereGeom, new THREE.MeshLambertMaterial({ color: colors[d.sector] }));
            visual.scale.set(radius, radius, radius);
            pGroup.add(visual);

            const collider = new THREE.Mesh(new THREE.SphereGeometry(0.06), new THREE.MeshBasicMaterial({ visible: false }));
            collider.userData = pGroup.userData; 
            pGroup.add(collider);
            intersectables.push(collider);

            const depthLine = new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0, -py, 0)]),
                new THREE.LineBasicMaterial({ color: colors[d.sector], transparent: true, opacity: 0.5 })
            );
            pGroup.add(depthLine);

            graphGroup.add(pGroup);
            pointGroups.push(pGroup);
        });

        // UI Panels
        const titlePanel = createTextPanel(["ILLUSTRATIVE DATA ONLY", "50 Fictional Companies"], "#111", "#AAA", 600, 150, 32);
        titlePanel.position.set(0, 0.7, 0); containerGroup.add(titlePanel);

        const instructionPanel = createTextPanel(["Welcome! Point & pull trigger to explore.", "Grab empty space and twist to rotate."], "#2980b9", "#FFF", 800, 150, 36);
        instructionPanel.position.set(0, 0.9, 0); containerGroup.add(instructionPanel);

        const detailsPanel = createTextPanel([""], "#222", "#FFF", 600, 400, 40);
        detailsPanel.position.set(0, 0.9, 0); detailsPanel.visible = false;
        containerGroup.add(detailsPanel);

        const exitPanel = createTextPanel(["EXIT VR/AR"], "#c0392b", "#FFF", 400, 150, 48);
        exitPanel.position.set(0, -0.6, 0); containerGroup.add(exitPanel);
        exitPanel.userData = { isExit: true };
        intersectables.push(exitPanel);

        const legendGroup = new THREE.Group();
        legendGroup.position.set(0.7, 0.2, 0);
        sectors.forEach((sec, i) => {
            const hexColor = '#' + colors[sec].toString(16).padStart(6, '0');
            const leg = createTextPanel([sec], hexColor, "#FFF", 250, 80, 36);
            leg.position.set(0, -i * 0.12, 0);
            leg.userData = { isLegend: true, sector: sec };
            legendGroup.add(leg);
            intersectables.push(leg);
        });
        containerGroup.add(legendGroup);

        // --- INTERACTION & LOGIC ---
        let lastInteractionTime = performance.now();
        const updateActivity = () => { lastInteractionTime = performance.now(); };

        const updatePointsVisibility = () => {
            pointGroups.forEach(p => p.visible = activeSectors[p.userData.sector]);
        };

        const handleSelect = (hit) => {
            updateActivity();
            if (hit.userData.isDataPoint) {
                const d = hit.userData.data;
                const hexColor = '#' + colors[d.sector].toString(16).padStart(6, '0');
                detailsPanel.userData.updateText([
                    d.name, `Sector: ${d.sector}`,
                    `Revenue: $${d.revenue.toFixed(1)}B`, `Market Cap: $${d.marketCap.toFixed(1)}B`,
                    `Employees: ${(d.employees/1000).toFixed(1)}k`, `Age: ${d.age} yrs`
                ], hexColor);
                detailsPanel.visible = true; instructionPanel.visible = false;
            } else if (hit.userData.isLegend) {
                const s = hit.userData.sector;
                activeSectors[s] = !activeSectors[s];
                hit.material.opacity = activeSectors[s] ? 1.0 : 0.4;
                hit.material.transparent = true;
                updatePointsVisibility();
            } else if (hit.userData.isExit) {
                renderer.xr.getSession()?.end();
            }
        };

        // Desktop Fallback
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.2, -1.8); controls.update();
        const raycaster = new THREE.Raycaster();
        window.addEventListener('pointerdown', (e) => {
            if (renderer.xr.isPresenting) return;
            const pointer = new THREE.Vector2((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(intersectables, false);
            if (intersects.length > 0) handleSelect(intersects[0].object);
            else updateActivity();
        });

        // VR Controllers
        let isDragging = false;
        let dragController = null;
        const prevPos = new THREE.Vector3();
        const tempMatrix = new THREE.Matrix4();

        const onSelectStart = (e) => {
            const c = e.target;
            tempMatrix.identity().extractRotation(c.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(c.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
            const intersects = raycaster.intersectObjects(intersectables, false);

            if (intersects.length > 0) {
                handleSelect(intersects[0].object);
            } else {
                isDragging = true; dragController = c;
                prevPos.setFromMatrixPosition(c.matrixWorld);
            }
        };
        const onSelectEnd = () => { isDragging = false; dragController = null; updateActivity(); };

        const controller1 = renderer.xr.getController(0);
        controller1.addEventListener('selectstart', onSelectStart);
        controller1.addEventListener('selectend', onSelectEnd);
        scene.add(controller1);
        
        const controller2 = renderer.xr.getController(1);
        controller2.addEventListener('selectstart', onSelectStart);
        controller2.addEventListener('selectend', onSelectEnd);
        scene.add(controller2);

        const cFactory = new XRControllerModelFactory();
        const cg1 = renderer.xr.getControllerGrip(0);
        cg1.add(cFactory.createControllerModel(cg1)); scene.add(cg1);
        const cg2 = renderer.xr.getControllerGrip(1);
        cg2.add(cFactory.createControllerModel(cg2)); scene.add(cg2);

        const pointerGeom = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-10)]);
        const pointerLine = new THREE.Line(pointerGeom, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 }));
        controller1.add(pointerLine.clone()); controller2.add(pointerLine.clone());

        // --- RENDER LOOP ---
        renderer.setAnimationLoop(() => {
            if (isDragging && dragController) {
                const curPos = new THREE.Vector3().setFromMatrixPosition(dragController.matrixWorld);
                containerGroup.rotation.y += (curPos.x - prevPos.x) * 10;
                containerGroup.rotation.x += (curPos.y - prevPos.y) * 10;
                prevPos.copy(curPos);
                updateActivity();
            }

            if (performance.now() - lastInteractionTime > 45000) {
                containerGroup.rotation.set(0, 0, 0);
                activeSectors = { "Tech": true, "Finance": true, "Health": true, "Retail": true, "Energy": true };
                updatePointsVisibility();
                legendGroup.children.forEach(l => { l.material.opacity = 1.0; });
                detailsPanel.visible = false; instructionPanel.visible = true;
                lastInteractionTime = performance.now();
            }

            renderer.render(scene, camera);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
